name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install requests
          pip install flake8
      - name: Syntax check
        run: |
          python -m py_compile router_core.py mcp_server.py auto_router.py
          flake8 router_core.py --max-line-length=120 --ignore=E402,W503
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
